name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches:
      - main

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run backend linting
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml build --quiet backend
          docker compose -f docker-compose.yml -f docker-compose.override.yml run --rm backend bash lint.sh

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run backend tests
        run: |
          PROJECT_NAME="test"
          COMPOSE_FILES="-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml"
          docker compose -p $PROJECT_NAME $COMPOSE_FILES up -d --build db backend
          docker compose -p $PROJECT_NAME $COMPOSE_FILES exec backend bash seed.sh
          docker compose -p $PROJECT_NAME $COMPOSE_FILES exec backend bash tests.sh
          docker compose -p $PROJECT_NAME $COMPOSE_FILES down -v

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run frontend linting
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml build --quiet frontend
          docker compose -f docker-compose.yml -f docker-compose.override.yml run --rm frontend bash lint.sh

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run frontend E2E tests
        run: |
          PROJECT_NAME="test"
          COMPOSE_FILES="-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml"
          docker compose -p $PROJECT_NAME $COMPOSE_FILES up -d --build
          docker compose -p $PROJECT_NAME $COMPOSE_FILES exec backend bash seed.sh
          docker compose -p $PROJECT_NAME $COMPOSE_FILES exec -T frontend bash tests.sh
          docker compose -p $PROJECT_NAME $COMPOSE_FILES down -v

